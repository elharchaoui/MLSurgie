name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m pytest -q
      - run: mlsurgie demo --output runs/ci-demo
      - run: mlsurgie replay runs/ci-demo
      - run: mlsurgie bench --editor random-search --seeds 0 --iterations 2 --output runs/ci-bench
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,harness]'
      - run: docker build -f containers/Dockerfile.constructor -t mlsurgie-constructor:local .
      - run: python -m pytest tests/test_harness.py -q
        env:
          MLSURGIE_DOCKER_TEST: '1'
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
          OPENHANDS_SUPPRESS_BANNER: '1'
