[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlsurgie"
version = "0.1.0"
description = "Construct neural networks through explicit, evaluated weight-space programs"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "torch>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
mlsurgie = "mlsurgie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
